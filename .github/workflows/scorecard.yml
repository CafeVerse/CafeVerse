name: 'OpenSSF Scorecard'

on:
  push:
    branches: ['main']
  schedule:
    - cron: '30 1 * * 6' # Weekly on Saturdays

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the Security tab
      security-events: write
      # Needed to publish results and request a private scoring run
      id-token: write
      # Needed to read the repo
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to enable the OpenSSF badge on the repository
          publish_results: true

      - name: Upload to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
