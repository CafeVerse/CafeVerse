appId: io.github.cafeverse.cafeverse
productName: CafeVerse
compression: maximum
directories:
  buildResources: build
electronLanguages:
  - en-US
files:
  - 'out/**/*'
  - 'resources/**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,docs,doc,examples}'
  - '!**/node_modules/**/*.d.ts'
  - '!**/node_modules/**/*.map'

win:
  executableName: cafeverse
  icon: build/icon.ico
  target:
    - target: nsis
    - target: msi
nsis:
  artifactName: CafeVerse-${version}-windows${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
msi:
  artifactName: CafeVerse-${version}-windows${arch}.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
mac:
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: CafeVerse-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: CafeVerse-${version}-linux-${arch}.${ext}
deb:
  artifactName: CafeVerse-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: CafeVerse
  repo: CafeVerse
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
